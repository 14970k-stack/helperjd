name: Jisu webtoon video
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jisu-video.yml'
      - 'render.py'
      - 'content/**'
      - 'assets/**'
permissions:
  contents: read
concurrency:
  group: jisu-video-production
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk python3-pil
      - name: Render webtoon with narration and music
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: /usr/bin/python3 render.py
      - name: Save video and preview frames
        uses: actions/upload-artifact@v4
        with:
          name: jisu-webtoon-${{ github.run_id }}
          path: |
            output/jisu-sample.mp4
            output/card-*.png
            output/manifest.json
          retention-days: 7
          if-no-files-found: error
